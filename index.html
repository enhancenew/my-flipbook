<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flipbook Viewer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="flip-viewer">
      <!-- Top Overlay Bar -->
      <header class="top-bar">
        <div class="brand">
          <span class="brand-logo"></span>
          <div class="brand-text">
            <span class="eyebrow">Digital Edition</span>
            <h1>Vande Bharat - Special Edition</h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="shareBtn" title="Share">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
          </button>
          <button class="icon-btn" id="downloadBtn" title="Download PDF">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          </button>
        </div>
      </header>

      <!-- Navigation Overlays -->
      <nav class="nav-overlay">
        <button class="nav-arrow nav-prev" id="prevPage" aria-label="Previous Page">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="nav-arrow nav-next" id="nextPage" aria-label="Next Page">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </nav>

      <section class="viewport-stage">
        <div class="book-container" id="bookViewport">
          <div class="book-floor-shadow"></div>
          <div class="book-wrapper">
            <button class="cover-gate" id="closedCover">
              <img id="closedCoverImage" alt="Book Cover">
            </button>
            <div class="book-canvas" id="book"></div>
            <div class="empty-msg" id="emptyState">
              No pages found in <code>pages/</code>.
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Control Bar -->
      <footer class="bottom-dock">
        <div class="dock-left">
          <button class="dock-btn" id="firstPage" title="First Page">
            <svg viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
          </button>
          <button class="dock-btn" id="prevDock" title="Previous">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>

        <div class="dock-center">
          <div class="page-info">
            <span id="pageCurrent">1</span> / <span id="pageTotal">1</span>
          </div>
          <input type="range" id="pageSlider" min="1" max="1" value="1">
        </div>

        <div class="dock-right">
          <button class="dock-btn" id="nextDock" title="Next">
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="dock-btn" id="lastPage" title="Last Page">
            <svg viewBox="0 0 24 24"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></svg>
          </button>
          <div class="dock-divider"></div>
          <button class="dock-btn" id="zoomOut" title="Zoom Out">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="dock-btn" id="zoomIn" title="Zoom In">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="dock-btn" id="fullscreen" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </footer>
    </main>

    <script src="vendor/page-flip.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
