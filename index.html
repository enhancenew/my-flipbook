<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Flipbook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="flip-viewer">
      <header class="viewer-bar" aria-label="Flipbook toolbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Digital Magazine</p>
            <h1>Custom Flipbook</h1>
          </div>
        </div>

        <div class="toolbar-actions">
          <button class="icon-button" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button class="icon-button" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>
          </button>
        </div>
      </header>

      <section class="reader-stage" aria-label="Flipbook reader">
        <button class="side-button side-button-left" id="prevPage" type="button" aria-label="Previous page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>

        <div class="book-viewport" id="bookViewport">
          <div class="book-shadow" aria-hidden="true"></div>
          <div class="book-frame">
            <button class="closed-cover" id="closedCover" type="button" aria-label="Open flipbook">
              <img id="closedCoverImage" alt="Flipbook cover">
            </button>
            <div class="book" id="book" aria-live="polite"></div>
            <div class="empty-state" id="emptyState">
              Add images to <code>pages/</code>, run <code>npm run build</code>, and publish.
            </div>
          </div>
        </div>

        <button class="side-button side-button-right" id="nextPage" type="button" aria-label="Next page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </section>

      <footer class="control-dock" aria-label="Page controls">
        <button class="dock-button" id="firstPage" type="button" aria-label="First page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18 5 12l6-6M19 6v12"/></svg>
        </button>
        <button class="dock-button" id="prevDock" type="button" aria-label="Previous page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>

        <div class="page-meter">
          <output class="counter" aria-live="polite">
            <span id="pageCurrent">1</span>
            <span>/</span>
            <span id="pageTotal">1</span>
          </output>
          <input id="pageSlider" type="range" min="1" max="1" value="1" aria-label="Go to page">
        </div>

        <button class="dock-button" id="nextDock" type="button" aria-label="Next page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="dock-button" id="lastPage" type="button" aria-label="Last page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 18 6-6-6-6M5 6v12"/></svg>
        </button>
      </footer>
    </main>

    <script src="vendor/page-flip.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
