<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKSSL - Flipbook Collection</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --bar-color: rgba(18, 18, 18, 0.98);
            --accent-gold: #d4af37;
            --text-main: #e0e0e0;
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --btn-hover-text: #fff;
            --slider-bg: rgba(255, 255, 255, 0.1);
            --toolbar-h: 50px;
        }
        body.light-theme {
            --bg-color: #f5f5f5;
            --bar-color: rgba(255, 255, 255, 0.98);
            --accent-gold: #b8860b;
            --text-main: #2c2c2c;
            --btn-hover-bg: rgba(0, 0, 0, 0.05);
            --btn-hover-text: #000;
            --slider-bg: rgba(0, 0, 0, 0.1);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            overflow-x: hidden; background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        body.is-mobile .header h1 { font-size: 12px; }
        
        .header {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 100; backdrop-filter: blur(10px);
            position: sticky; top: 0;
        }
        body:not(.light-theme) .header { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header h1 { font-size: 14px; letter-spacing: 2px; color: var(--accent-gold); margin: 0; }
        
        .library-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            justify-items: center;
        }
        .book-card {
            background: var(--bar-color);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: var(--accent-gold);
        }
        .book-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .book-info {
            padding: 15px;
            text-align: center;
        }
        .book-title {
            font-size: 16px;
            color: var(--accent-gold);
            margin: 0;
            font-weight: 600;
        }

        .app-container { display: none; flex-direction: column; height: 100vh; }
        .view-stage {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; padding: 40px; background: var(--bg-color);
        }
        #flipbook {
            display: none; background-color: transparent; border-radius: 4px;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 0.3s;
        }
        .page { background: var(--bg-color); overflow: hidden; position: relative; }
        .page-blank { background: var(--bg-color); width: 100%; height: 100%; }
        .page-content {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .page-bg {
            position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
            width: calc(100% + 40px); height: calc(100% + 40px);
            object-fit: cover; filter: blur(25px) brightness(0.3); opacity: 0.6; z-index: 1;
        }
        .page-img {
            position: relative; max-width: 92%; max-height: 92%;
            object-fit: contain; z-index: 5;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
        }
        .footer {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100;
        }
        .btn-tool {
            background: none; border: none; color: #888; cursor: pointer;
            padding: 8px; border-radius: 50%; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-tool:hover { color: var(--btn-hover-text); background: var(--btn-hover-bg); }
        .page-counter { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
        
        .volume-slider {
            width: 0; opacity: 0; transition: all 0.3s ease; cursor: pointer; height: 4px;
            -webkit-appearance: none; background: var(--slider-bg); border-radius: 2px; outline: none;
        }
        .volume-container:hover .volume-slider { width: 80px; opacity: 1; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent-gold); border-radius: 50%; cursor: pointer; }

        #loader { display: none; text-align: center; position: absolute; }
        .spinner {
            width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #back-to-library {
            display: flex; align-items: center; gap: 5px; font-size: 12px;
            color: var(--accent-gold); cursor: pointer; padding: 8px 15px;
            border-radius: 20px; background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        #back-to-library:hover { background: var(--btn-hover-bg); color: var(--btn-hover-text); }
    </style>
</head>
<body>
    <header class="header">
        <div style="display: flex; align-items: center; gap: 20px; flex: 1; overflow: hidden;">
            <div id="logo-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" title="Toggle Theme">
                <i id="theme-logo" data-lucide="moon"></i>
            </div>
            <h1 id="app-title">FLIPBOOK COLLECTION</h1>
            <div id="back-to-library" style="display: none;"><i data-lucide="arrow-left" style="width: 14px;"></i> BACK TO LIBRARY</div>
        </div>
        <div class="controls" id="flipbook-controls" style="display: none; margin-right: 15px;">
            <select id="select-autoflip" style="background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; font-size: 11px; padding: 4px 8px; cursor: pointer; outline: none;">
                <option value="0">Autoflip: Off</option>
                <option value="5000">Autoflip: 5s</option>
                <option value="10000">Autoflip: 10s</option>
            </select>
        </div>
        <button class="btn-tool" id="btn-fs-header" title="Fullscreen"><i data-lucide="maximize"></i></button>
    </header>

    <div id="library-view" class="library-container"></div>

    <div class="app-container" id="app-container">
        <main class="view-stage">
            <div id="loader">
                <div class="spinner"></div>
                <p style="font-size: 12px; opacity: 0.5;">Loading Book...</p>
            </div>
            <div id="flipbook"></div>
        </main>
        <footer class="footer">
            <div style="flex: 1;"></div>
            <div style="display: flex; align-items: center; gap: 15px; justify-content: center; flex: 2;">
                <button class="btn-tool" id="btn-first"><i data-lucide="chevrons-left"></i></button>
                <button class="btn-tool" id="btn-prev"><i data-lucide="chevron-left"></i></button>
                <div class="page-counter"><span id="curr">0</span> / <span id="total">0</span></div>
                <button class="btn-tool" id="btn-next"><i data-lucide="chevron-right"></i></button>
                <button class="btn-tool" id="btn-last"><i data-lucide="chevrons-right"></i></button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end;">
                <div class="volume-container" style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.1" value="1">
                    <button class="btn-tool" id="btn-mute" title="Mute/Unmute"><i data-lucide="volume-2"></i></button>
                </div>
            </div>
        </footer>
        <audio id="bg-music" loop></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const libraryView = document.getElementById('library-view');
            const appContainer = document.getElementById('app-container');
            const backToLibrary = document.getElementById('back-to-library');
            const appTitle = document.getElementById('app-title');
            const flipbookControls = document.getElementById('flipbook-controls');
            const bookEl = document.getElementById('flipbook');
            const loader = document.getElementById('loader');
            const music = document.getElementById('bg-music');
            
            let currentFlip = null;
            let manifest = null;

            const themeLogo = document.getElementById('theme-logo');
            const applyTheme = (isDark) => {
                if (isDark) document.body.classList.remove('light-theme');
                else document.body.classList.add('light-theme');
                themeLogo.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
                if (window.lucide) lucide.createIcons();
            };
            document.getElementById('logo-container').onclick = () => applyTheme(document.body.classList.contains('light-theme'));
            lucide.createIcons();

            try {
                const res = await fetch("manifest.json?t=" + Date.now());
                manifest = await res.json();
                renderLibrary(manifest.books);
            } catch (e) { console.error(e); }

            function renderLibrary(books) {
                libraryView.innerHTML = '';
                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = '<img src="' + book.cover + '" class="book-cover"><div class="book-info"><h3 class="book-title">' + book.title + '</h3></div>';
                    card.onclick = () => loadBook(book);
                    libraryView.appendChild(card);
                });
            }

            async function loadBook(book) {
                libraryView.style.display = 'none';
                appContainer.style.display = 'flex';
                backToLibrary.style.display = 'flex';
                flipbookControls.style.display = 'block';
                appTitle.textContent = book.title;
                loader.style.display = 'block';
                bookEl.style.display = 'none';
                bookEl.innerHTML = '';

                if (currentFlip) { currentFlip.destroy(); currentFlip = null; }
                music.pause(); music.src = book.music || '';

                let pages = [...book.pages];
                if (pages.length % 2 !== 0) pages.splice(pages.length - 1, 0, { isBlank: true });
                
                document.getElementById('total').textContent = pages.length;
                document.getElementById('curr').textContent = 1;

                await Promise.all(pages.map(p => {
                    if (p.isBlank) return Promise.resolve();
                    return new Promise(resolve => {
                        const img = new Image();
                        img.onload = resolve; img.onerror = resolve;
                        img.src = p.src;
                    });
                }));

                pages.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "page";
                    if (p.isBlank) div.innerHTML = "<div class='page-blank'></div>";
                    else div.innerHTML = '<div class="page-content"><img class="page-bg" src="' + p.src + '"><img class="page-img" src="' + p.src + '"></div>';
                    bookEl.appendChild(div);
                });

                currentFlip = new St.PageFlip(bookEl, {
                    width: 550, height: 733, size: "stretch", autoSize: true, centeringPerspective: true,
                    minWidth: 300, maxWidth: 1000, minHeight: 400, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: true, flippingTime: 1000, usePortrait: true
                });

                currentFlip.loadFromHTML(document.querySelectorAll('.page'));
                loader.style.display = 'none'; bookEl.style.display = 'block';

                currentFlip.on("flip", (e) => {
                    document.getElementById('curr').textContent = e.data + 1;
                    if (e.data > 0 && e.data < pages.length - 1) music.play().catch(() => {});
                    else music.pause();
                });

                window.onresize = () => currentFlip.update();
            }

            backToLibrary.onclick = () => {
                libraryView.style.display = 'grid';
                appContainer.style.display = 'none';
                backToLibrary.style.display = 'none';
                flipbookControls.style.display = 'none';
                appTitle.textContent = 'FLIPBOOK COLLECTION';
                if (currentFlip) { currentFlip.destroy(); currentFlip = null; }
                music.pause();
            };

            document.getElementById('btn-prev').onclick = () => currentFlip?.flipPrev();
            document.getElementById('btn-next').onclick = () => currentFlip?.flipNext();
            document.getElementById('btn-first').onclick = () => currentFlip?.flip(0);
            document.getElementById('btn-last').onclick = () => currentFlip?.flip(currentFlip.getPageCount() - 1);
            document.getElementById('btn-fs-header').onclick = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            };
            
            const volumeSlider = document.getElementById('volume-slider');
            volumeSlider.oninput = (e) => music.volume = e.target.value;
            document.getElementById('btn-mute').onclick = () => {
                music.muted = !music.muted;
                document.getElementById('btn-mute').innerHTML = music.muted ? '<i data-lucide="volume-x"></i>' : '<i data-lucide="volume-2"></i>';
                lucide.createIcons();
            };
        });
    </script>
</body>
</html>
