<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKSSL - Special Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .view-stage {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; padding: 40px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }
        #flipbook {
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            display: none;
            /* Realistic page stack effect on the sides */
            background-image: 
                linear-gradient(to right, #222 1px, transparent 1px),
                linear-gradient(to left, #222 1px, transparent 1px);
            background-size: 5px 100%;
            background-repeat: repeat-y;
            background-position: 0 0, 100% 0;
            border-radius: 4px;
        }
        .page { 
            background: #0a0a0a; 
            overflow: hidden; 
            /* Inner page shadow for depth */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        /* Visual indication of page stack on the edges */
        .page::before {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 10px;
            z-index: 10;
        }
        .stf__block.-left .page::before {
            right: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.5), transparent);
        }
        .stf__block.-right .page::before {
            left: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.5), transparent);
        }
        :root {
            --bg-color: #0a0a0a;
            --bar-color: rgba(18, 18, 18, 0.98);
            --accent-gold: #d4af37;
            --text-main: #e0e0e0;
            --toolbar-h: 50px;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
        }
        .app-container {
            display: flex; flex-direction: column; height: 100vh;
        }
        .header {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100; backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 14px; letter-spacing: 2px; color: var(--accent-gold); margin: 0; }
        
        
        
        .page img { width: 100%; height: 100%; object-fit: contain; }
        .footer {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: center;
            padding: 0 20px; gap: 20px; border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
        .btn-tool {
            background: none; border: none; color: #888; cursor: pointer;
            padding: 8px; border-radius: 50%; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-tool:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .page-counter { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
        #loader { text-align: center; }
        .spinner {
            width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .page-blank { background: #0a0a0a; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>HKSSL ????</h1>
            <div class="controls">
                <button class="btn-tool" id="btn-fs"><i data-lucide="maximize"></i></button>
            </div>
        </header>
        <main class="view-stage">
            <div id="loader">
                <div class="spinner"></div>
                <p style="font-size: 12px; opacity: 0.5;">Generating Experience...</p>
            </div>
            <div id="flipbook"></div>
        </main>
        <footer class="footer">
            <button class="btn-tool" id="btn-first"><i data-lucide="chevrons-left"></i></button>
            <button class="btn-tool" id="btn-prev"><i data-lucide="chevron-left"></i></button>
            <div class="page-counter"><span id="curr">0</span> / <span id="total">0</span></div>
            <button class="btn-tool" id="btn-next"><i data-lucide="chevron-right"></i></button>
            <button class="btn-tool" id="btn-last"><i data-lucide="chevrons-right"></i></button>
        </footer>
        <audio id="bg-music" loop></audio>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const bookEl = document.getElementById('flipbook');
            const currEl = document.getElementById('curr');
            const totalEl = document.getElementById('total');
            const music = document.getElementById('bg-music');
            
            try {
                const res = await fetch("pages.json?t=" + Date.now());
                const data = await res.json();
                let pages = data.pages;

                // Set music source if available
                if (data.music) {
                    music.src = data.music;
                } else {
                    // Fallback to Indian Wedding Sitar if no file is in music/ folder
                    // music.src = "https://cdn.pixabay.com/audio/2022/03/23/audio_827f2f1e6a.mp3";
                }

                if (pages.length % 2 !== 0) {
                    pages.splice(pages.length - 1, 0, { isBlank: true, alt: "Blank Page" });
                }

                totalEl.textContent = pages.length;

                pages.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'page';
                    if (p.isBlank) {
                        div.innerHTML = "<div class=\"page-blank\"></div>";
                    } else {
                        div.innerHTML = "<img src=\"" + p.src + "\" alt=\"" + p.alt + "\">";
                    }
                    bookEl.appendChild(div);
                });

                const flip = new St.PageFlip(bookEl, {
                    width: 550, height: 733, size: "stretch", autoSize: true, centeringPerspective: true,
                    minWidth: 300, maxWidth: 1000, minHeight: 400, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: false, flippingTime: 1200, usePortrait: false, startZIndex: 0, maxShadowOpacity: 0.6
                });

                flip.loadFromHTML(document.querySelectorAll('.page'));
                document.getElementById('loader').style.display = 'none';
                bookEl.style.display = 'block';

                flip.on('flip', (e) => { 
                    const pageIndex = e.data;
                    currEl.textContent = pageIndex + 1; 

                    // Audio Logic
                    if (pageIndex > 0 && pageIndex < (pages.length - 1)) {
                        if (music.paused) music.play().catch(err => console.log("Music play blocked:", err));
                    } else if (pageIndex === 0 || pageIndex === (pages.length - 1)) {
                        music.pause();
                        if (pageIndex === 0) music.currentTime = 0;
                    }
                });

                document.getElementById('btn-prev').onclick = () => flip.flipPrev();
                document.getElementById('btn-next').onclick = () => flip.flipNext();
                document.getElementById('btn-first').onclick = () => flip.flip(0);
                document.getElementById('btn-last').onclick = () => flip.flip(pages.length - 1);
                document.getElementById('btn-fs').onclick = () => {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                    else document.exitFullscreen();
                };

                window.onresize = () => flip.update();
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
