<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HKSSL Presentation - Special Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --af-light-blue: #3498db;
            --af-grey-bg: #f4f7f8;
            --af-border: #e1e8ed;
            --accent-gold: #d4af37;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--af-grey-bg);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden; touch-action: none;
        }

        .presentation-container {
            display: flex; flex-direction: column; height: 100dvh;
            width: 100%; margin: 0; padding: 0; box-sizing: border-box;
        }

        .basic-left-container {
            flex: 1; background: #0a0a0a; 
            overflow: hidden; 
            display: flex; flex-direction: column;
        }

        .view-stage {
            flex: 1; background: transparent; position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 10px;
        }

        #flipbook {
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: none; background-color: #0a0a0a; border-radius: 4px;
            transition: transform 0.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            max-width: 100%; max-height: 100%;
        }
        .page { background: #0a0a0a; overflow: hidden; position: relative; }
        .page-content {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .page-bg {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(20px) brightness(0.3); opacity: 0.5; z-index: 1;
        }
        .page-img {
            position: relative; width: 100%; height: 100%;
            object-fit: contain; z-index: 5;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        /* Stack Effect */
        .page::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 4px; z-index: 15; opacity: 0.4;
        }

        .book-footer {
            flex-shrink: 0;
            padding: 10px 15px; 
            background: rgba(18, 18, 18, 0.95); 
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            position: relative; z-index: 20;
        }
        .footer-left, .footer-right, .footer-center { display: flex; align-items: center; gap: 10px; }

        @media (max-width: 768px) {
            .view-stage { padding: 5px; }
            .book-footer { 
                padding: 10px; 
                flex-wrap: wrap; 
                justify-content: center; 
                gap: 10px; 
                background: rgba(10, 10, 10, 0.98);
            }
            .footer-left, .footer-right { order: 2; }
            .footer-center { order: 1; width: 100%; justify-content: center; margin-bottom: 2px; }
            .btn-tool { padding: 8px; }
            .select-tool { padding: 6px 10px; font-size: 12px; }
            .page-counter { min-width: 50px; font-size: 13px; }
            .btn-fs-text { display: none; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .book-footer { padding: 5px 15px; gap: 10px; flex-wrap: nowrap; }
            .footer-center { width: auto; order: 0; margin-bottom: 0; }
            .footer-left, .footer-right { order: 0; }
            .view-stage { padding: 2px; }
        }
        .btn-tool {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; cursor: pointer;
            padding: 8px; border-radius: 4px; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
        }
        .btn-tool:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
        .btn-tool.active { background: var(--af-light-blue); color: #fff; border-color: var(--af-light-blue); }
        .select-tool {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; cursor: pointer;
            padding: 7px 10px; border-radius: 4px; transition: all 0.2s;
            font-size: 13px; font-weight: 600; outline: none;
        }
        .select-tool option { background: #1a1a1a; color: #fff; }
        .select-tool:focus { border-color: var(--af-light-blue); color: #fff; }
        .page-counter { font-size: 14px; font-weight: 600; color: #aaa; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
        
        .btn-fs-text { font-size: 13px; font-weight: 600; color: var(--af-light-blue); cursor: pointer; text-decoration: underline; }

        #loader { text-align: center; width: 100%; }
        .spinner {
            width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--af-light-blue); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .page-blank { background: #0a0a0a; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="presentation-container">
        <div class="basic-left-container">
            <div class="view-stage">
                <div id="loader">
                    <div class="spinner"></div>
                    <p style="font-size: 12px; opacity: 0.5; color: #fff;">Launching Presentation...</p>
                </div>
                <div id="flipbook"></div>
            </div>
            
            <div class="book-footer">
                <div class="footer-left">
                    <button class="btn-tool" id="btn-first" title="First Page"><i data-lucide="chevrons-left"></i></button>
                    <button class="btn-tool" id="btn-prev" title="Previous Page"><i data-lucide="chevron-left"></i></button>
                </div>

                <div class="footer-center">
                    <div class="page-counter"><span id="curr">0</span> / <span id="total">0</span></div>
                    <button class="btn-tool" id="btn-mute" title="Toggle Mute"><i data-lucide="volume-2"></i></button>
                    <div style="width: 10px;"></div>
                    <select class="select-tool" id="select-autoflip">
                        <option value="0">Auto-Flip: Off</option>
                        <option value="5000">5 Seconds</option>
                        <option value="10000">10 Seconds</option>
                    </select>
                </div>

                <div class="footer-right">
                    <button class="btn-tool" id="btn-next" title="Next Page"><i data-lucide="chevron-right"></i></button>
                    <button class="btn-tool" id="btn-last" title="Last Page"><i data-lucide="chevrons-right"></i></button>
                    <div style="width: 20px;"></div>
                    <span class="btn-fs-text" id="btn-fs">Fullscreen</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const bookEl = document.getElementById('flipbook');
            const currEl = document.getElementById('curr');
            const totalEl = document.getElementById('total');
            const music = document.getElementById('bg-music');
            try {
                const res = await fetch("pages.json?t=" + Date.now());
                const data = await res.json();
                let pages = data.pages;
                if (data.music) music.src = data.music;
                if (pages.length % 2 !== 0) pages.splice(pages.length - 1, 0, { isBlank: true, alt: "Blank Page" });
                totalEl.textContent = pages.length;
                pages.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "page";
                    if (p.isBlank) {
                        div.innerHTML = "<div class=\"page-blank\"></div>";
                    } else {
                        div.innerHTML = "<div class=\"page-content\"><img class=\"page-bg\" src=\"" + p.src + "\"><img class=\"page-img\" src=\"" + p.src + "\" alt=\"" + p.alt + "\"></div>";
                    }
                    bookEl.appendChild(div);
                });
                const flip = new St.PageFlip(bookEl, {
                    width: 550, height: 733, size: "stretch", autoSize: true, centeringPerspective: true,
                    minWidth: 300, maxWidth: 1000, minHeight: 400, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: true, flippingTime: 1000, usePortrait: true, 
                    startZIndex: 0, maxShadowOpacity: 0.6, showDoublePage: true
                });
                flip.loadFromHTML(document.querySelectorAll('.page'));
                
                const updateTransform = (index) => {
                    const orientation = flip.getOrientation();
                    if (orientation === 'landscape') {
                        if (index === 0) bookEl.style.transform = "translateX(-25%)";
                        else if (index === pages.length - 1) bookEl.style.transform = "translateX(25%)";
                        else bookEl.style.transform = "translateX(0)";
                    } else {
                        bookEl.style.transform = "translateX(0)";
                    }
                };

                document.getElementById('loader').style.display = 'none';
                bookEl.style.display = 'block';
                setTimeout(() => updateTransform(0), 100);

                let autoFlipInterval = null;
                let currentDelay = 0; // 0 means auto-flip is off or paused

                const startAutoFlip = (delay) => {
                    stopAutoFlip();
                    if (delay <= 0) return;
                    currentDelay = delay;
                    autoFlipInterval = setInterval(() => {
                        const curr = flip.getCurrentPageIndex();
                        if (curr < pages.length - 1) {
                            if (curr === 0) {
                                updateTransform(1);
                                setTimeout(() => flip.flipNext(), 550);
                            } else {
                                flip.flipNext();
                            }
                        } else {
                            stopAutoFlip();
                            document.getElementById('select-autoflip').value = "0";
                            currentDelay = 0;
                        }
                    }, delay);
                };

                const stopAutoFlip = () => {
                    if (autoFlipInterval) {
                        clearInterval(autoFlipInterval);
                        autoFlipInterval = null;
                    }
                };

                flip.on("flip", (e) => { 
                    const pageIndex = e.data;
                    currEl.textContent = pageIndex + 1; 
                    updateTransform(pageIndex);
                    if (pageIndex > 0 && pageIndex < (pages.length - 1)) {
                        if (music.paused) {
                            music.play().then(() => {
                                if (currentDelay > 0 && !autoFlipInterval) startAutoFlip(currentDelay);
                            }).catch(e => {});
                        }
                    } else {
                        music.pause();
                        stopAutoFlip();
                        if (pageIndex === 0) {
                            music.currentTime = 0;
                            document.getElementById('select-autoflip').value = "0";
                            currentDelay = 0;
                        }
                    }
                });

                document.getElementById('select-autoflip').onchange = (e) => {
                    const val = parseInt(e.target.value);
                    if (val === 0) {
                        stopAutoFlip();
                        currentDelay = 0;
                    } else {
                        startAutoFlip(val);
                    }
                };

                document.getElementById('btn-prev').onclick = () => {
                    const curr = flip.getCurrentPageIndex();
                    if (curr === pages.length - 1) {
                        updateTransform(pages.length - 2);
                        setTimeout(() => flip.flipPrev(), 550);
                    } else {
                        flip.flipPrev();
                    }
                };
                document.getElementById('btn-next').onclick = () => {
                    const curr = flip.getCurrentPageIndex();
                    if (curr === 0) {
                        updateTransform(1);
                        setTimeout(() => flip.flipNext(), 550);
                    } else {
                        flip.flipNext();
                    }
                };
                document.getElementById('btn-first').onclick = () => {
                    updateTransform(0);
                    setTimeout(() => flip.flip(0), 550);
                };
                document.getElementById('btn-last').onclick = () => {
                    updateTransform(pages.length - 1);
                    setTimeout(() => flip.flip(pages.length - 1), 550);
                };
                document.getElementById('btn-fs').onclick = () => {
                    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                    else document.exitFullscreen();
                };
                document.getElementById('btn-mute').onclick = () => {
                    music.muted = !music.muted;
                    const btn = document.getElementById('btn-mute');
                    btn.innerHTML = `<i data-lucide="${music.muted ? 'volume-x' : 'volume-2'}"></i>`;
                    lucide.createIcons();
                };
                window.onresize = () => {
                    flip.update();
                    updateTransform(flip.getCurrentPageIndex());
                };
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
