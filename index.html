<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKSSL - Special Edition</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --surface-color: #2d2d2d;
            --accent-saffron: #FF9933;
            --accent-green: #138808;
            --accent-blue: #000080;
            --text-color: #ffffff;
            --toolbar-height: 60px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        /* Toolbar */
        .toolbar {
            height: var(--toolbar-height);
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: absolute;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
            border-bottom: 2px solid var(--accent-blue);
        }

        .toolbar .title {
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent-saffron);
        }

        .toolbar .controls {
            display: flex;
            gap: 15px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Flipbook Container */
        #flipbook-container {
            position: absolute;
            top: var(--toolbar-height);
            bottom: var(--toolbar-height);
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; /* Reduced padding */
            box-sizing: border-box;
        }

        .flip-book {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden until loaded */
            margin: auto;
        }

        .page {
            background-color: white;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Bottom Bar */
        .bottom-bar {
            height: var(--toolbar-height);
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
            gap: 20px;
        }

        .page-info {
            font-size: 0.9rem;
            min-width: 100px;
            text-align: center;
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 20px 10px;
            cursor: pointer;
            z-index: 150;
            transition: background 0.2s;
        }

        .nav-arrow:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .nav-arrow.prev { left: 0; border-radius: 0 5px 5px 0; }
        .nav-arrow.next { right: 0; border-radius: 5px 0 0 5px; }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--accent-saffron);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">HKSSL <span style="color: white; font-weight: normal; font-size: 0.8rem;">SPECIAL EDITION</span></div>
        <div class="controls">
            <button class="btn-icon" id="btn-fullscreen" title="Toggle Fullscreen"><i data-lucide="maximize"></i></button>
        </div>
    </div>

    <button class="nav-arrow prev" id="btn-prev"><i data-lucide="chevron-left"></i></button>
    <button class="nav-arrow next" id="btn-next"><i data-lucide="chevron-right"></i></button>

    <div id="flipbook-container">
        <div id="loader">
            <div class="spinner"></div>
            <p>Loading Magazine...</p>
        </div>
        <div id="flipbook" class="flip-book">
            <!-- Pages will be injected here -->
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-icon" id="btn-first" title="First Page"><i data-lucide="chevrons-left"></i></button>
        <div class="page-info">
            Page <span id="current-page">0</span> of <span id="total-pages">0</span>
        </div>
        <button class="btn-icon" id="btn-last" title="Last Page"><i data-lucide="chevrons-right"></i></button>
    </div>

    <!-- Page Flip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const flipBookElement = document.getElementById('flipbook');
            const pageInfo = document.getElementById('current-page');
            const totalPageInfo = document.getElementById('total-pages');
            const loader = document.getElementById('loader');
            let pageFlip = null;

            function getBookSize() {
                const container = document.getElementById('flipbook-container');
                const w = container.clientWidth - 40;
                const h = container.clientHeight - 40;
                return { w, h };
            }

            try {
                const response = await fetch('pages.json');
                const data = await response.json();
                const pages = data.pages;
                totalPageInfo.textContent = pages.length;
                
                pages.forEach((page) => {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.innerHTML = `<img src="${page.src}" alt="${page.alt}" loading="lazy">`;
                    flipBookElement.appendChild(pageDiv);
                });

                const size = getBookSize();

                pageFlip = new St.PageFlip(flipBookElement, {
                    width: 550,
                    height: 733,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1200,
                    minHeight: 400,
                    maxHeight: 1600,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false,
                    usePortrait: true,
                    startPage: 0
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));
                loader.style.display = 'none';
                flipBookElement.style.display = 'block';

                pageFlip.on('flip', (e) => {
                    pageInfo.textContent = e.data + 1;
                });

                document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());
                document.getElementById('btn-first').addEventListener('click', () => pageFlip.flip(0));
                document.getElementById('btn-last').addEventListener('click', () => pageFlip.flip(pages.length - 1));
                
                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                });

                window.addEventListener('resize', () => {
                    pageFlip.update();
                });

            } catch (error) {
                console.error('Error initializing flipbook:', error);
                loader.innerHTML = '<p style="color: #ff6b6b;">Failed to load magazine. Please check pages.json.</p>';
            }
        });
    </script>
</body>
</html>
