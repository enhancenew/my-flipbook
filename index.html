<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Flipbook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="reader" aria-label="Flipbook reader">
        <div class="topbar">
          <div>
            <p class="kicker">GitHub Pages Flipbook</p>
            <h1>Custom Flipbook</h1>
          </div>
          <div class="counter" aria-live="polite">
            <span id="pageCurrent">1</span>
            <span>/</span>
            <span id="pageTotal">1</span>
          </div>
        </div>

        <div class="book-wrap">
          <button class="nav-button" id="prevPage" type="button" aria-label="Previous page">
            <span aria-hidden="true">&lsaquo;</span>
          </button>

          <div class="book-frame">
            <div class="book" id="book" aria-live="polite"></div>
            <div class="empty-state" id="emptyState">
              Add images to <code>pages/</code>, run <code>npm run build</code>, and publish.
            </div>
          </div>

          <button class="nav-button" id="nextPage" type="button" aria-label="Next page">
            <span aria-hidden="true">&rsaquo;</span>
          </button>
        </div>

        <div class="controls">
          <button id="firstPage" type="button">First</button>
          <button id="lastPage" type="button">Last</button>
          <button id="fullscreen" type="button">Fullscreen</button>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
