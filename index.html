<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKSSL - Special Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --bar-color: rgba(18, 18, 18, 0.98);
            --accent-gold: #d4af37;
            --text-main: #e0e0e0;
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --btn-hover-text: #fff;
            --slider-bg: rgba(255, 255, 255, 0.1);
            --toolbar-h: 60px;
            --pillar-w: 30px;
            --book-w: 550px;
            --book-h: 367px;
        }
        body.light-theme {
            --bg-color: #f5f5f5;
            --bar-color: rgba(255, 255, 255, 0.98);
            --accent-gold: #b8860b;
            --text-main: #2c2c2c;
            --btn-hover-bg: rgba(0, 0, 0, 0.05);
            --btn-hover-text: #000;
            --slider-bg: rgba(0, 0, 0, 0.1);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        .header {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 1000; backdrop-filter: blur(10px); flex-shrink: 0;
        }
        .header h1 { font-size: 14px; letter-spacing: 2px; color: var(--accent-gold); margin: 0; }
        
        .view-stage {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; padding: 20px;
            background: var(--bg-color); z-index: 1;
        }
        
        #flipbook {
            display: none; background-color: transparent; border-radius: 4px;
            width: var(--book-w); height: var(--book-h);
        }
        
        .page { 
            background: var(--bg-color); overflow: hidden; position: relative;
            width: 100%; height: 100%;
        }
        .page-content {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        
        /* Fixed Pillar Design */
        .pillar {
            position: absolute; top: 0; bottom: 0; width: var(--pillar-w);
            background: linear-gradient(to right, #111, #333, #111);
            z-index: 20; box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .pillar-l { left: 0; border-right: 1px solid rgba(255,255,255,0.1); }
        .pillar-r { right: 0; border-left: 1px solid rgba(255,255,255,0.1); }
        
        .img-container {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 0 var(--pillar-w); box-sizing: border-box; z-index: 10;
        }
        
        .page-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; /* This auto-sizes the image while sustaining detailing */
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Logic for orientations */
        .is-portrait .page-img { height: 100%; width: auto; }
        .is-landscape .page-img { width: 100%; height: auto; }

        /* Exclude covers from pillars and forced sizing */
        .is-cover .pillar { display: none; }
        .is-cover .img-container { padding: 0; }
        .is-cover .page-img { width: 100%; height: 100%; object-fit: cover; }

        .page-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; filter: blur(30px) brightness(0.2); opacity: 0.6; z-index: 1;
        }

        .footer {
            height: var(--toolbar-h); background: var(--bar-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-top: 1px solid rgba(255,255,255,0.05); 
            z-index: 1000; flex-shrink: 0;
        }
        .btn-tool { background: none; border: none; color: #888; cursor: pointer; padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-tool:hover { color: var(--btn-hover-text); background: var(--btn-hover-bg); }
        .page-counter { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
        
        #loader { text-align: center; }
        .spinner { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a;
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 1s ease-out, visibility 1s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        .splash-img { max-width: 100%; max-height: 70vh; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <img src="loader.png" class="splash-img" alt="Front Cover">
            <p style="color: var(--accent-gold); margin-top: 20px; font-size: 14px; letter-spacing: 2px;">PREPARING YOUR EXPERIENCE...</p>
        </div>
    </div>
    <div class="app-container">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 20px; flex: 1;">
                <div id="logo-container" style="cursor: pointer;"><i id="theme-logo" data-lucide="moon"></i></div>
                <h1>HKSSL &#128141; &#127881;</h1>
            </div>
            <button class="btn-tool" id="btn-fs-header"><i data-lucide="maximize"></i></button>
        </header>
        <main class="view-stage">
            <div id="loader"><div class="spinner"></div><p style="font-size: 12px; opacity: 0.5;">Generating Experience...</p></div>
            <div id="flipbook"></div>
        </main>
        <footer class="footer">
            <div style="flex: 1;"></div>
            <div style="display: flex; align-items: center; gap: 15px; justify-content: center; flex: 2;">
                <button class="btn-tool" id="btn-first"><i data-lucide="chevrons-left"></i></button>
                <button class="btn-tool" id="btn-prev"><i data-lucide="chevron-left"></i></button>
                <div class="page-counter"><span id="curr">0</span> / <span id="total">0</span></div>
                <button class="btn-tool" id="btn-next"><i data-lucide="chevron-right"></i></button>
                <button class="btn-tool" id="btn-last"><i data-lucide="chevrons-right"></i></button>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end;">
                <button class="btn-tool" id="btn-mute"><i data-lucide="volume-2"></i></button>
            </div>
        </footer>
        <audio id="bg-music" loop></audio>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => splash.classList.add('hidden'), 3000);
            
            const themeLogo = document.getElementById('theme-logo');
            const applyTheme = (isDark) => {
                document.body.classList.toggle('light-theme', !isDark);
                themeLogo.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
                if (window.lucide) lucide.createIcons();
            };
            document.getElementById('logo-container').onclick = () => applyTheme(document.body.classList.contains('light-theme'));
            lucide.createIcons();

            const bookEl = document.getElementById('flipbook');
            const music = document.getElementById('bg-music');

            try {
                const res = await fetch("pages.json?t=" + Date.now());
                const data = await res.json();
                let pages = data.pages;
                if (data.music) music.src = data.music;
                if (pages.length % 2 !== 0) pages.splice(pages.length - 1, 0, { isBlank: true });
                document.getElementById('total').textContent = pages.length;

                pages.forEach((p, index) => {
                    const div = document.createElement("div");
                    const isCover = p.name && (p.name.toLowerCase().includes('frontcover') || p.name.toLowerCase().includes('backcover'));
                    div.className = "page" + (isCover ? " is-cover" : "");
                    
                    if (p.isBlank) {
                        div.innerHTML = "<div class='page-blank'></div>";
                    } else {
                        div.innerHTML = `
                            <div class="page-content">
                                ${!isCover ? '<img class="page-bg" src="' + p.src + '">' : ''}
                                <div class="pillar pillar-l"></div>
                                <div class="img-container">
                                    <img class="page-img" src="${p.src}" alt="${p.alt}">
                                </div>
                                <div class="pillar pillar-r"></div>
                            </div>`;
                        
                        // Detect Orientation
                        const img = new Image();
                        img.onload = () => {
                            if (img.naturalHeight > img.naturalWidth) div.classList.add('is-portrait');
                            else div.classList.add('is-landscape');
                        };
                        img.src = p.src;
                    }
                    bookEl.appendChild(div);
                });

                const flip = new St.PageFlip(bookEl, {
                    width: 550, height: 367, size: "fixed", autoSize: false,
                    showCover: true, mobileScrollSupport: true, flippingTime: 1000, usePortrait: true
                });

                flip.loadFromHTML(document.querySelectorAll('.page'));
                document.getElementById('loader').style.display = 'none';
                bookEl.style.display = 'block';

                flip.on("flip", (e) => { 
                    document.getElementById('curr').textContent = e.data + 1;
                    if (e.data > 0 && e.data < pages.length - 1) music.play().catch(() => {});
                    else music.pause();
                });

                document.getElementById('btn-prev').onclick = () => flip.flipPrev();
                document.getElementById('btn-next').onclick = () => flip.flipNext();
                document.getElementById('btn-first').onclick = () => flip.flip(0);
                document.getElementById('btn-last').onclick = () => flip.flip(pages.length - 1);
                document.getElementById('btn-mute').onclick = () => {
                    music.muted = !music.muted;
                    document.getElementById('btn-mute').innerHTML = music.muted ? '<i data-lucide="volume-x"></i>' : '<i data-lucide="volume-2"></i>';
                    lucide.createIcons();
                };
                window.onresize = () => flip.update();
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
